name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to (re)publish, e.g. v0.14.0."
        required: true
        type: string
      publish_vscode_marketplace:
        description: Publish this tag to the VS Code Marketplace.
        required: false
        type: boolean
        default: true
      attach_github_release:
        description: Attach the VSIX to the GitHub Release.
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: Verify and package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Validate tag matches package.json
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "Tag $RELEASE_TAG does not match package.json version $expected." >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Compile
        run: pnpm compile

      - name: Package extension
        run: rm -rf dist && mkdir -p dist && pnpm package

      - name: Upload packaged VSIX
        uses: actions/upload-artifact@v7
        with:
          name: glm-for-copilot-vsix
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: write
      # Required for OIDC trusted publishing to the VS Code Marketplace.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.11.0
          package-manager-cache: false

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate

      - name: Download packaged VSIX
        uses: actions/download-artifact@v7
        with:
          name: glm-for-copilot-vsix
          path: dist

      - name: Locate VSIX
        id: vsix
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/*.vsix)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one VSIX in dist, found ${#files[@]}" >&2
            printf '%s\n' "${files[@]}" >&2
            exit 1
          fi
          echo "path=${files[0]}" >> "$GITHUB_OUTPUT"

      - name: Publish to VS Code Marketplace
        if: vars.PUBLISH_VSCODE_MARKETPLACE != 'false' && (github.event_name == 'push' || inputs.publish_vscode_marketplace)
        # OIDC trusted publishing; needs the Marketplace policy for this repo,
        # workflow (release.yml), and the production environment. Pinned vsce
        # because workflow_dispatch can target tags older than 4.1.1.
        run: pnpm dlx @vscode/vsce@4.1.1 publish --oidc --packagePath "${{ steps.vsix.outputs.path }}" --skip-duplicate

      - name: Attach VSIX to GitHub Release
        if: github.event_name == 'push' || inputs.attach_github_release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          files: ${{ steps.vsix.outputs.path }}
          fail_on_unmatched_files: true
          generate_release_notes: ${{ github.event_name == 'push' }}

      - name: Show release info
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: echo "Released $RELEASE_TAG"
